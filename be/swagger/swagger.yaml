  /api2/user/sse/{floors}/{rooms}:
    get:
      summary: "สตรีมข้อมูล Microsoft event ผู้ใช้ตามห้อง แสดงที่จอหน้าห้องประชุม ซึ่งปกติจะดึงทุก 6 วินาทีแต่เมื่อมีการจองจะดึงไวขึ้นเป็นทุก 3 วินาที ชั่วคราว"
      tags: [User]
      parameters:
        - name: floors
          in: path
          required: true
          schema: { type: string }
        - name: rooms
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"results":[{"@odata.etag":"W/\"OSKGJxgwRX0etlQAAAHMkxQ==\"","id":"AAMkAG...","subject":"L...chaeng ","isAllDay":false,"responseStatus":{"response":"accepted","time":"2025-05-19T09:43:34.1564391Z"},"start":{"dateTime":"2025-09-30T02:00:00.0000000","timeZone":"UTC"},"end":{"dateTime":"2025-09-30T05:00:00.0000000","timeZone":"UTC"},"locations":[{"displayName":"Microsoft Teams Meeting","locationType":"default","uniqueId":"Microsoft Teams Meeting","uniqueIdType":"private"},{"displayName":"DTG Meeting Room L : \\15>15","locationUri":"1515@tcc-technology.com","locationType":"conferenceRoom","uniqueId":"1515@tcc-technology.com","uniqueIdType":"directory","address":{"street":"","city":"","state":"","countryOrRegion":"","postalCode":""},"coordinates":{}}],"organizer":{"emailAddress":{"name":"L...ng","address":"mail@mail.com"}}},

  /api2/user/key:
    post:
      summary: "ตรวจสอบ PIN ผู้ใช้ เมื่อกรอกเพื่อยืนยันการเปิดประตูห้องประชุม"
      description: |
        ตรวจสอบความถูกต้องของ PIN ที่ผู้ใช้กรอกเพื่อเข้าถึงห้องประชุม
        
        **ขั้นตอนการทำงาน:**
        1. ตรวจสอบว่า eventId มีอยู่ในระบบหรือไม่
        2. ตรวจสอบ PIN กับฐานข้อมูล bookingkey
        3. ถ้าถูกต้อง จะอัปเดตสถานะ isPinVerified และเปิดประตู
        4. บันทึก log การเข้าถึงห้อง
        
        **หมายเหตุ:** PIN ที่ใช้จะต้องตรงกับ PIN ที่ตั้งไว้ตอนจองห้อง
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinValidationRequest'
            examples:
              with_event:
                summary: "ตรวจสอบ PIN พร้อม Event ID"
                value:
                  eventId: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA"
                  pin: "1234"
                  room_number: "1501"
      responses:
        '200':
          description: PIN ถูกต้อง - ประตูห้องจะถูกเปิด
          content:
            application/json:
              schema:
                type: object
                required: [pinValid, message]
                properties:
                  pinValid:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "PIN verified successfully. Door opened."
                  roomAccessed:
                    type: string
                    example: "1501"
                  accessTime:
                    type: string
                    format: date-time
                    example: "2025-09-30T14:30:00.000Z"
        '400':
          description: ข้อมูลไม่ครบหรือไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_fields:
                  value:
                    error: "Missing required fields: pin, room_number"
                invalid_pin:
                  value:
                    error: "Invalid PIN"
        '404':
          description: ไม่พบข้อมูลการจองหรือห้องประชุม
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                event_not_found:
                  value:
                    message: "Event not found or already accessed"
        '500':
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api2/user/admin-key:
    post:
      summary: "เปิดประตูด้วย PIN แอดมิน"
      description: |
        ใช้ PIN ของ Admin หรือ Housekeeper เพื่อเปิดประตูห้องประชุม
        
        **กรณีการใช้งาน:**
        - Admin ต้องการเข้าห้องเพื่อตรวจสอบหรือจัดเตรียม
        - Housekeeper เข้าห้องเพื่อทำความสะอาด
        - กรณีฉุกเฉินที่ต้องการเข้าห้องโดยไม่มีการจอง
        
        **ความปลอดภัย:** 
        - บันทึก log การเข้าถึงทุกครั้ง
        - ตรวจสอบ PIN กับฐานข้อมูลผู้ใช้
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string }
                room_number: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Password match!" }

  /api2/user/search-pin:
    post:
      summary: "Booking Meeting ขั้นตอนที่ 2: ค้นหาหรือสร้างหมายเลข PIN สำหรับการประชุม"
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pindata:
                  type: object
                  required:
                    - eventId
                    - room_number
                    - organizerMail
                    - pin
                    - startDateTime
                    - endDateTime
                  properties:
                    eventId:
                      type: string
                      description: Microsoft Graph Event ID
                      example: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MAFRAAA="
                    room_number:
                      type: integer
                      description: หมายเลขห้องประชุม
                      example: 1501
                    organizerMail:
                      type: string
                      description: อีเมลของผู้จัดประชุม
                      example: "organizer@t...gy.com"
                    pin:
                      type: string
                      description: หมายเลข PIN สำหรับการยืนยัน
                      example: "1234"
                    startDateTime:
                      type: string
                      format: date-time
                      description: วันและเวลาเริ่มการประชุม
                      example: "2025-09-29T02:00:00Z"
                    endDateTime:
                      type: string
                      format: date-time
                      description: วันและเวลาสิ้นสุดการประชุม
                      example: "2025-09-29T03:00:00Z"
      responses:
        '200':
          description: สร้างหรือค้นหา PIN สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: ข้อมูลไม่ครบหรือไม่พบ eventId
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "All fields are required"
        '500':
          description: Server error - ไม่สามารถค้นหาหรือสร้าง PIN ได้
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Failed to search pin by event ID"


  /api2/user/endmeeting:
    patch:
      summary: "สิ้นสุดการประชุม (Update event) การประชุมปัจจุบันให้มีเวลาสิ้นสุดการประชุมเป็นเวลาปัจจุบัน"
      description: |
        อัปเดตเวลาสิ้นสุดของการประชุมใน Microsoft Calendar ให้เป็นเวลาปัจจุบัน
        
        **ขั้นตอนการทำงาน:**
        1. ดึงข้อมูล Event จาก Microsoft Graph API
        2. อัปเดตเวลาสิ้นสุด (endDateTime) เป็นเวลาปัจจุบัน
        3. บันทึกการเปลี่ยนแปลงใน Microsoft Calendar
        4. อัปเดตสถานะในฐานข้อมูลภายใน
        
        **การใช้งาน:** ใช้เมื่อการประชุมสิ้นสุดก่อนเวลาที่กำหนดไว้เดิม
      tags: [User]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endmeetingdata: 
                  type: object
                  properties:
                    eventId:
                      type: string
                      example: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA"
                    startdatetime:
                      type: string
                      format: date-time
                      example: "2025-09-30T09:00:00Z"
                    isAllDay:
                      type: boolean
                      example: false
      responses:
        '200':
          description: Update event successfully

  /api2/user/closedoor:
    post:
      summary: "ปิดประตูห้องประชุม ตามห้องที่ระบุพร้อมเก็บ log การปิดประตู"
      description: |
        สั่งปิดประตูห้องประชุมด้วยระบบอิเล็กทรอนิกส์
        
        **ขั้นตอนการทำงาน:**
        1. ตรวจสอบหมายเลขห้องประชุม
        2. ส่งสัญญาณปิดประตูไปยังระบบควบคุม
        3. บันทึก log การปิดประตูพร้อมเวลา
        4. อัปเดตสถานะประตูในฐานข้อมูล
        
        **การใช้งาน:** 
        - หลังจากการประชุมสิ้นสุด
        - เมื่อต้องการรักษาความปลอดภัย
        - กรณีฉุกเฉิน
      tags: [User]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                room_number: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Door for room 1515 closed successfully" }

  /api2/user/ms/delete:
    delete:
      summary: "ลบการจอง Microsoft"
      description: |
        ลบ Event ใน Microsoft Graph ตาม eventId และอัปเดตสถานะใน DB:
        - ถ้าอยู่ในโหมด debug → ข้ามการลบ
        - ถ้าห้องอยู่ในรายการยกเว้น (exception list) → ข้ามการลบ
        - ถ้า Event ใน DB ถูก verify PIN ไปแล้ว หรือถูกลบไปก่อนหน้า → ข้ามการลบ
        - มิฉะนั้น ทำการลบ Event ที่ MS Graph แล้ว mark isPinVerified = "not access"
        - `หมายเหตุ`: ถ้ามีห้องไหนถูกลบจะถูกเพิ่มจำนวนครั้งที่พลาดลง DB เเละเมื่อครบ 5 ครั้งจะส่งเมลเตือน
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMsBookingRequest'
            examples:
              default:
                value:
                  eventId: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA..."
                  room_number: "1502"
      responses:
        '200':
          description: สำเร็จหรือถูกข้ามตามเงื่อนไข (debug / exception / already verified / already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMsBookingSuccess'
              examples:
                deleted:
                  summary: "ลบสำเร็จ"
                  value: { message: "Event deleted successfully" }
                debug_skip:
                  summary: "โหมด debug ข้ามการลบ"
                  value: { message: "Debug mode - skip delete" }
                except_room_skip:
                  summary: "ห้องอยู่ในรายการยกเว้น"
                  value: { message: "Room 1502 is in the exception list, skip delete." }
                verified_skip:
                  summary: "เคย verify PIN หรือถูกลบไปแล้ว"
                  value: { message: "Event AAMkAG... already verified by PIN or was deleted. Skip delete." }
        '401':
          description: ไม่มี access token ภายในระบบ (ฝั่งเซิร์ฟเวอร์ไม่เจอ token ใน cache)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  value: { error: "No refresh token found. Please login again." }
        '404':
          description: ไม่พบ Event ในฐานข้อมูลภายใน (bookingKey)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                not_found:
                  value: { message: "Event not found in DB" }
        '500':
          description: ล้มเหลวจากสาเหตุอื่น (เช่น MS Graph ล้มเหลว / DB error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                generic:
                  value: { error: "Failed to delete event" }


  /api2/user/ms/create:
    post:
      summary: "ขั้นตอนที่ 1 Booking Meeting: สร้างการจองห้องประชุม Microsoft"
      description: |
        สร้างการจองห้องประชุมใหม่ผ่าน Microsoft Graph API
        
        **ขั้นตอนการทำงาน:**
        1. ตรวจสอบความพร้อมใช้งานของห้อง
        2. สร้าง Event ใน Microsoft Calendar
        3. ส่งการเชิญไปยังห้องประชุม
        4. บันทึกข้อมูลการจองในฐานข้อมูลภายใน
        
        **หมายเหตุ:** ต้องมี Microsoft Graph API access token ที่ถูกต้อง
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [createroomdata]
              properties:
                createroomdata:
                  $ref: '#/components/schemas/CreateMeetingRequest'
            examples:
              standard_meeting:
                summary: "การจองห้องประชุมทั่วไป"
                value:
                  createroomdata:
                    RoomNumber: "1501"
                    startdatetime: "2025-09-30T09:00:00Z"
                    enddatetime: "2025-09-30T10:00:00Z"
                    subject: "Weekly Team Meeting"
              long_meeting:
                summary: "การจองห้องประชุมแบบยาว"
                value:
                  createroomdata:
                    RoomNumber: "1514"
                    startdatetime: "2025-09-30T13:00:00Z"
                    enddatetime: "2025-09-30T17:00:00Z"
                    subject: "Quarterly Review Meeting"
      responses:
        '200':
          description: สร้างการจองสำเร็จ - Event ถูกสร้างใน Microsoft Calendar แล้ว
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Meeting created successfully"
                  data:
                    type: object
                    properties:
                      eventId:
                        type: string
                        description: Microsoft Graph Event ID ที่สร้างขึ้น
                        example: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA"
                      room:
                        type: string
                        example: "1501"
                      startTime:
                        type: string
                        format: date-time
                        example: "2025-09-30T09:00:00Z"
                      endTime:
                        type: string
                        format: date-time
                        example: "2025-09-30T10:00:00Z"
                      nextStep:
                        type: string
                        example: "Please proceed to step 2: Set PIN for room access"
        '400':
          description: ข้อมูลไม่ครบหรือไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_fields:
                  value:
                    error: "Missing required fields: RoomNumber, startdatetime, enddatetime"
                invalid_time:
                  value:
                    error: "Invalid time range: End time must be after start time"
                room_not_available:
                  value:
                    error: "Room 1501 is not available during the requested time"
        '401':
          description: ไม่มีสิทธิ์เข้าถึง Microsoft Graph API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                no_token:
                  value:
                    error: "No access token found. Please login again."
        '409':
          description: ห้องถูกจองแล้วในช่วงเวลาที่ระบุ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Room 1501 is already booked from 09:00 to 10:00"
                  conflictingEvents:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeetingEvent'
        '500':
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ms_graph_error:
                  value:
                    error: "Failed to create event in Microsoft Graph"
                db_error:
                  value:
                    error: "Failed to save booking information to database"

  ########################################################
  # Superadmin
  ########################################################
  /api1/superadmin/createadmin:
    post:
      summary: "สร้างผู้ดูแลระดับสูง (Admin)"
      description: |
        Endpoint สำหรับ Superadmin เท่านั้น  
        ใช้สร้างผู้ใช้ใหม่ที่มี role = "Admin"  
        จะมีการตรวจสอบไม่ให้ซ้ำกับ email, name, หรือ pin ที่มีอยู่แล้ว
      tags: [Superadmin]
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'JWT token แบบ Bearer — ตัวอย่าง: "Bearer eyJhbGciOiJI..."'
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, pin]
              properties:
                email: { type: string, example: "admin01@domain.com" }
                password: { type: string, format: password, example: "StrongPass123!" }
                name: { type: string, example: "Admin01" }
                pin: { type: string, example: "1234" }
      responses:
        '201':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Create Admin successfully" }
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: string }
                          role: { type: string, example: "Admin" }
                          name: { type: string }
                          pin: { type: string }
        '400':
          description: ซ้ำกับข้อมูลที่มีอยู่แล้ว
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "This email is already in use. Please use a different one." }
        '403':
          description: ไม่ใช่ Superadmin
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Only SuperAdmin can create admin" }
        '500':
          description: Internal error

  /api1/superadmin/deleteadmin:
    delete:
      summary: "ลบผู้ดูแลระดับสูง (Admin)"
      description: |
        Endpoint สำหรับ Superadmin เท่านั้น  
        ใช้ลบผู้ใช้ที่มี role = "Admin" โดยเปลี่ยน role เป็น "Deactivate"  
        และบันทึก Log การลบ
      security:
        - bearerAuth: []
      tags: [Superadmin]
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'JWT token แบบ Bearer — ตัวอย่าง: "Bearer eyJhbGciOiJI..."'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, example: "66f60c5b8ffb8a8e2c1cdb5d" }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Admin's ID 66f60c5b8ffb8a8e2c1cdb5d has been deleted successfully" }
        '400':
          description: ไม่มี ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Admin's ID is required" }
        '403':
          description: ไม่ใช่ Superadmin
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Only SuperAdmin can delete admin" }
        '404':
          description: ไม่พบ Admin ในเอกสาร
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Admin is not found in Documents" }
        '500':
          description: Internal error


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token ที่ได้จากการ login สำเร็จ
        รูปแบบ: `Bearer <token>`

  schemas:
    # ─────────────────────────────
    # Generic / Common Schemas
    # ─────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: รายละเอียดของข้อผิดพลาด
          example: "Failed to delete event"

    NotFoundResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: ข้อความแจ้งว่าไม่พบข้อมูล
          example: "Event not found in DB"

    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          description: สถานะความสำเร็จของการดำเนินการ
          example: true
        message:
          type: string
          description: ข้อความแจ้งผลการดำเนินการ
          example: "Operation completed successfully"

    # ─────────────────────────────
    # User & Account Schemas
    # ─────────────────────────────
    UserProfile:
      type: object
      required: [id, name, role, pin]
      properties:
        id:
          type: string
          description: รหัสผู้ใช้งาน (MongoDB ObjectId)
          example: "66f60c5b8ffb8a8e2c1cdb5d"
        name:
          type: string
          description: ชื่อผู้ใช้งาน
          example: "Admin User"
        email:
          type: string
          format: email
          description: อีเมลผู้ใช้งาน (เฉพาะ role Admin เท่านั้น)
          example: "admin@tcc-technology.com"
        role:
          type: string
          enum: ["Admin", "Housekeeper", "SuperAdmin", "Deactivate"]
          description: บทบาทของผู้ใช้งาน
          example: "Admin"
        pin:
          type: string
          description: รหัส PIN สำหรับยืนยันตัวตน
          example: "1234"
        login_status:
          type: string
          enum: ["online", "offline", "no permission"]
          description: สถานะการเข้าสู่ระบบ
          example: "online"
        createdAt:
          type: string
          format: date-time
          description: วันที่สร้างบัญชี
          example: "2025-09-20T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: วันที่อัปเดตล่าสุด
          example: "2025-09-30T14:20:00.000Z"

    # ─────────────────────────────
    # Meeting & Event Schemas
    # ─────────────────────────────
    MeetingEvent:
      type: object
      required: [eventId, room, start, end]
      properties:
        eventId:
          type: string
          description: รหัสการประชุมจาก Microsoft Graph API
          example: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA"
        room:
          type: string
          description: หมายเลขห้องประชุม
          example: "1501"
        subject:
          type: string
          description: หัวข้อการประชุม
          example: "Weekly Team Meeting"
        start:
          type: string
          format: date-time
          description: เวลาเริ่มต้นการประชุม (UTC)
          example: "2025-09-30T09:00:00.0000000Z"
        end:
          type: string
          format: date-time
          description: เวลาสิ้นสุดการประชุม (UTC)
          example: "2025-09-30T10:00:00.0000000Z"
        organizer:
          type: object
          description: ข้อมูลผู้จัดการประชุม
          properties:
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              format: email
              example: "john@tcc-technology.com"
        location:
          type: object
          description: สถานที่ประชุม
          properties:
            displayName:
              type: string
              example: "DTG Meeting Room L : \\15>01"
            locationUri:
              type: string
              example: "1501@tcc-technology.com"

    # ─────────────────────────────
    # PIN & Booking Schemas
    # ─────────────────────────────
    PinValidationRequest:
      type: object
      required: [pin, room_number]
      properties:
        eventId:
          type: string
          description: รหัสการประชุม (optional สำหรับการตรวจสอบ PIN ผู้ใช้)
          example: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA"
        pin:
          type: string
          description: รหัส PIN ที่ผู้ใช้กรอก
          example: "1234"
        room_number:
          type: string
          description: หมายเลขห้องประชุม
          example: "1501"

    # ─────────────────────────────
    # Microsoft Graph API Schemas
    # ─────────────────────────────
    DeleteMsBookingRequest:
      type: object
      required: [eventId, room_number]
      properties:
        eventId:
          type: string
          description: Microsoft Graph Event ID ที่ต้องการลบ
          example: "AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA"
        room_number:
          type: string
          description: หมายเลขห้อง (ใช้สำหรับตรวจสอบ exception list)
          example: "1502"

    DeleteMsBookingSuccess:
      type: object
      properties:
        message:
          type: string
          description: ข้อความแจ้งผลการลบ
          example: "Event deleted successfully"

    CreateMeetingRequest:
      type: object
      required: [RoomNumber, startdatetime, enddatetime]
      properties:
        RoomNumber:
          type: string
          pattern: '^[0-9]{4}$'
          description: หมายเลขห้องที่ต้องการจอง (4 หลัก)
          example: "1501"
        startdatetime:
          type: string
          format: date-time
          description: วันและเวลาเริ่มการประชุม (ISO 8601 format)
          example: "2025-09-30T09:00:00Z"
        enddatetime:
          type: string
          format: date-time
          description: วันและเวลาสิ้นสุดการประชุม (ISO 8601 format)
          example: "2025-09-30T10:00:00Z"
        organizer:
          type: string
          format: email
          description: อีเมลผู้จัดประชุม
          example: "user@tcc-technology.com"
        subject:
          type: string
          description: หัวข้อการประชุม
          example: "Team Meeting"

    # ─────────────────────────────
    # Log & Monitoring Schemas
    # ─────────────────────────────
    LogEntry:
      type: object
      properties:
        _id:
          type: string
          description: รหัส Log entry
          example: "68cb80f155449c733a30d114"
        user_Id:
          type: string
          description: รหัสผู้ใช้ที่ทำการ
          example: "688df875ac82ce4bee989f00"
        L_status:
          type: string
          description: สถานะของ Log
          example: "Admin Logged in"
        role:
          type: string
          description: บทบาทของผู้ใช้
          example: "Admin"
        Details:
          type: string
          description: รายละเอียดของการกระทำ
          example: "Admin name: monitor"
        L_createdAt:
          type: string
          format: date-time
          description: เวลาที่เกิดเหตุการณ์
          example: "2025-09-18T03:48:01.889Z"

