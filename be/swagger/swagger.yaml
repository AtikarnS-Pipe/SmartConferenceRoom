  /api1/admin/login:
    get:
      summary: "เข้าสู่ระบบด้วย Microsoft Account (หลังจาก login local success)"
      description: |
        Endpoint นี้ใช้สำหรับเข้าสู่ระบบด้วย Microsoft Account หลังจากที่ทำการ authenticate ในระบบภายในเรียบร้อยแล้ว.
        
        **ขั้นตอนการทำงาน:**
        1. ตรวจสอบ email และ password กับฐานข้อมูลภายใน
        2. ถ้าถูกต้อง จะสร้าง JWT token สำหรับ session
        3. Redirect ไปยัง Microsoft OAuth เพื่อขอสิทธิ์เข้าถึง Microsoft Graph API
        4. เมื่อสำเร็จ Microsoft จะ redirect กลับมาพร้อม authorization code
        
        **ตัวอย่าง Redirect URL:**
        ```
        https://your-frontend-app.com/callback?code=M.C507_BAY.2.U.2174c3e1-8c2d-4b4e-9b4c-8d3e2174c3e1
        ```
      tags: [Admin Panel]
      parameters:
        - name: mail
          in: query
          required: true
          schema:
            type: string
            format: email
            example: "admin@tcc-technology.com"
          description: อีเมลของผู้ดูแลระบบที่ต้องการเข้าสู่ระบบ
        - name: password
          in: query
          required: true
          schema:
            type: string
            format: password
            example: "admin123"
          description: รหัสผ่านของผู้ดูแลระบบ
      responses:
        '302':
          description: Redirect ไปยัง redirect_uri พร้อม code แนบใน query string
          headers:
            Location:
              description: URL สำหรับ redirect (เช่น callback URL ของ Microsoft Login)
              schema:
                type: string
                example: https://your-frontend-app.com/callback?code=123456
        '200':
          description: Microsoft Login Success (กรณีตอบ JSON กลับมาแทน redirect)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login success"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI..."
        '401':
          description: Unauthorized (ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง)

  /api1/admin/schedule/{Room}/{startdate}/{enddate}:
    get:
      summary: "ดึงตารางการใช้งานห้อง"
      description: |
        คืนข้อมูลตารางการจองของห้องประชุมภายในช่วงวันกำหนด (โดยสตรีมผ่าน SSE).
        route นี้จะส่งข้อมูลแบบ Server‑Sent Events ไปยังผู้ใช้ทุก ๆ 10 วินาที
        เพื่อแจ้งเตือนการเปลี่ยนแปลงของตารางประชุมแบบเรียลไทม์.
        
        **ข้อมูลที่ส่งกลับ:**
        - `eventId`: รหัสการประชุมจาก Microsoft Graph
        - `room`: หมายเลขห้องประชุม
        - `start`: เวลาเริ่มต้นการประชุม (ISO 8601 format)
        - `end`: เวลาสิ้นสุดการประชุม (ISO 8601 format)
        - `subject`: หัวข้อการประชุม
        - `organizer`: ผู้จัดการประชุม
      tags: [Admin Panel]
      parameters:
        - name: Room
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
            example: "1501"
          description: หมายเลขห้องประชุม (4 หลัก เช่น 1501, 1502)
        - name: startdate
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2025-09-30"
          description: วันที่เริ่มต้นของช่วงที่ต้องการค้นหา (รูปแบบ YYYY-MM-DD)
        - name: enddate
          in: path
          required: true
          schema:
            type: string
            format: date
            example: "2025-09-30"
          description: วันที่สิ้นสุดของช่วงที่ต้องการค้นหา (รูปแบบ YYYY-MM-DD)
      responses:
        '200':
          description: ตารางการใช้งานห้องเป็นสตรีม - ข้อมูลจะถูกส่งทุก 10 วินาทีแบบ Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: scheduleUpdate
                  data: {"eventId":"AAMkAGZkODA4MTA2LTBjZjAtNDBhNC1hMDE5LWEyZTQzOGJhMDA1MABGAAAA","room":"1501","subject":"Weekly Team Meeting","start":"2025-09-30T09:00:00Z","end":"2025-09-30T10:00:00Z","organizer":{"name":"John Doe","email":"john@tcc-technology.com"}}
        '400':
          description: รูปแบบข้อมูลไม่ถูกต้อง
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ไม่พบห้องที่ระบุ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'

  ########################################################
  # Account
  ########################################################
  /api1/account/me:
    get:
      summary: "ดึงโปรไฟล์ผู้ใช้งาน"
      description: |
        ดึงข้อมูลโปรไฟล์ของผู้ใช้งานปัจจุบันจาก JWT token ที่ส่งมา
        ใช้สำหรับตรวจสอบข้อมูลผู้ใช้และสิทธิ์การเข้าถึง
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ข้อมูลโปรไฟล์ผู้ใช้งานปัจจุบัน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                admin_user:
                  summary: "ตัวอย่างผู้ใช้ Admin"
                  value:
                    id: "66f60c5b8ffb8a8e2c1cdb5d"
                    name: "Admin User"
                    email: "admin@tcc-technology.com"
                    role: "Admin"
                    pin: "1234"
                    login_status: "online"
                    createdAt: "2025-09-20T10:30:00.000Z"
                    updatedAt: "2025-09-30T14:20:00.000Z"
        '401':
          description: ไม่มีสิทธิ์เข้าถึง - JWT token ไม่ถูกต้องหรือหมดอายุ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  value:
                    error: "Invalid or expired token"
        '404':
          description: ไม่พบผู้ใช้งาน
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                user_not_found:
                  value:
                    message: "User not found"
        '500':
          description: เกิดข้อผิดพลาดภายในเซิร์ฟเวอร์
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api1/account/auth:
    post:
      summary: "เข้าสู่ระบบเฉพาะ Admin, SuperAdmin "
      description: |
        Endpoint สำหรับการ authentication ของผู้ใช้ที่มี role Admin หรือ SuperAdmin
        
        **ขั้นตอนการทำงาน:**
        1. ตรวจสอบ email และ password กับฐานข้อมูล
        2. ตรวจสอบ role ว่าเป็น Admin หรือ SuperAdmin
        3. สร้าง JWT token พร้อม refresh token
        4. อัปเดตสถานะ login_status เป็น "online"
        5. บันทึก log การเข้าสู่ระบบ
        
        **หมายเหตุ:** ใช้สำหรับ Admin Panel และ SuperAdmin Panel เท่านั้น
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  name: { type: string }
                  pin: { type: string }
                  role: { type: string }
        '404':
          description: User not found
        '400':
          description: Invalid credentials
        '500':
          description: Internal server error

  /api1/account/changeadminpw:
    patch:
      summary: "เปลี่ยน PIN ผู้ดูแล"
      description: |
        เปลี่ยน PIN ของผู้ดูแลระบบ (Admin) โดยผู้ใช้งานปัจจุบัน
        
        **ข้อจำกัด:**
        - ต้องมี JWT token ที่ถูกต้อง
        - PIN ใหม่ต้องมี 4 หลัก
        - เฉพาะ Admin เท่านั้นที่สามารถเปลี่ยน PIN ของตนเองได้
        
        **การใช้งาน:** ใช้เมื่อต้องการเปลี่ยน PIN สำหรับการเข้าถึงห้องประชุม
      tags: [Account]
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'JWT token แบบ Bearer — ตัวอย่าง: "Bearer eyJhbGciOiJI..."'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newpin: { type: string }
      responses:
        '200':
          description: เปลี่ยนรหัสผ่านตัวเองที่เป็น role admin สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  NewPin: { type: string, example: "1234" }
                  message: { type: string, example: "PIN updated successfully" }
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /api1/account/createhousekeeper:
    post:
      summary: "เพิ่มแม่บ้าน"
      description: |
        สร้างบัญชีแม่บ้านใหม่ในระบบ
        
        **สิทธิ์:** เฉพาะ Admin หรือ SuperAdmin เท่านั้น
        
        **ข้อมูลที่ต้องการ:**
        - ชื่อ (name): ต้องไม่ซ้ำกับที่มีอยู่แล้ว
        - PIN (pin): รหัส 4 หลักสำหรับเข้าถึงระบบ ต้องไม่ซ้ำ
        
        **การใช้งาน:** แม่บ้านจะใช้ PIN นี้เพื่อเข้าถึงห้องประชุมเพื่อทำความสะอาด
      tags: [Account]
      parameters:
        - name: Authorization
          in: header
          required: true
          description: 'JWT token แบบ Bearer — ตัวอย่าง: "Bearer eyJhbGciOiJI..."'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                pin: { type: string }
      responses:
        '201':
          description: Housekeeper created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string, example: "Housekeeper created successfully" }
                  data: { type: object, example: { id: "123", name: "Housekeeper Name", pin: "1234", role: "housekeeper", createdBy: "22313",login_status: 'no permission'  } }
         
