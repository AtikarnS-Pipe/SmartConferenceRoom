  /api1/admin/login:
    get:
      summary: เข้าสู่ระบบด้วย Microsoft Account (หลังจาก login local success)
      description: |
        Endpoint นี้ใช้สำหรับเข้าสู่ระบบด้วย Microsoft Account.
        เมื่อสำเร็จ ระบบจะ redirect ไปยัง redirect_uri พร้อมแนบ `code` ใน query string.
        เช่น:
        ```
        https://your-frontend-app.com/callback?code=123456
        ```
      tags: [Admin Panel]
      parameters:
        - name: mail
          required: true
          schema:
            type: string
          description: Organizer Mail 
        - name: password
          required: true
          schema:
            type: string
          description: Password
      responses:
        '302':
          description: Redirect ไปยัง redirect_uri พร้อม code แนบใน query string
          headers:
            Location:
              description: URL สำหรับ redirect (เช่น callback URL ของ Microsoft Login)
              schema:
                type: string
                example: https://your-frontend-app.com/callback?code=123456
        '200':
          description: Microsoft Login Success (กรณีตอบ JSON กลับมาแทน redirect)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login success"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI..."
        '401':
          description: Unauthorized (ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง)

  /api1/admin/schedule/{Room}/{startdate}/{enddate}:
    get:
      summary: ดึงตารางการใช้งานห้อง
      description: |
        คืนข้อมูลตารางการจองของห้องประชุมภายในช่วงวันกำหนด (โดยสตรีมผ่าน SSE).
        route นี้จะส่งข้อมูลแบบ Server‑Sent Events ไปยังผู้ใช้ทุก ๆ 10 วินาที
        เพื่อแจ้งเตือนการเปลี่ยนแปลงของตารางประชุมแบบเรียลไทม์.
      tags: [Admin Panel]
      parameters:
        - name: Room
          in: path
          required: true
          schema:
            type: string
          description: หมายเลขห้องประชุม
        - name: startdate
          in: path
          required: true
          schema:
            type: string
            format: date
          description: วันที่เริ่มต้นของช่วงที่ต้องการค้นหา (YYYY-MM-DD)
        - name: enddate
          in: path
          required: true
          schema:
            type: string
            format: date
          description: วันที่สิ้นสุดของช่วงที่ต้องการค้นหา (YYYY-MM-DD)
      responses:
        '200':
          description: ตารางการใช้งานห้องเป็นสตรีม
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  data: {"eventId":"abc123","room":"0701","start":"2025-01-01T09:00:00Z","end":"2025-01-01T10:00:00Z"}\n\n
        get:
          summary: ดึงตารางการใช้งานห้อง
          description: |
            คืนข้อมูลตารางการจองห้องประชุมภายในช่วงวันกำหนดแบบ SSE
          tags: [Admin Panel]
          parameters:
            - name: Room
              in: path
              required: true
              schema:
                type: string
            - name: startdate
              in: path
              required: true
              schema:
                type: string
                format: date
            - name: enddate
              in: path
              required: true
              schema:
                type: string
                format: date
          responses:
            '200':
              description: ตารางห้อง (stream)
              content:
                text/event-stream:
                  schema:
                    type: string
                    example: |
                      data: {"eventId":"abc123","room":"0701","start":"2025-01-01T09:00:00Z"}\n\n

  ########################################################
  # Account
  ########################################################
  /api1/account/me:
    get:
      summary: ดึงโปรไฟล์ผู้ใช้งาน
      tags: [Account]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: โปรไฟล์ผู้ใช้
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  email: { type: string }
                  role: { type: string }

  /api1/account/auth:
    post:
      summary: เข้าสู่ระบบผู้ดูแล
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  name: { type: string }
                  role: { type: string }

  /api1/account/changeadminpw:
    patch:
      summary: เปลี่ยน PIN ผู้ดูแล
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newpin: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api1/account/createhousekeeper:
    post:
      summary: เพิ่มแม่บ้าน
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                pin: { type: string }
      responses:
        '201':
          description: สร้างแม่บ้านสำเร็จ

  /api1/account/edithousekeeper:
    patch:
      summary: แก้ไข PIN แม่บ้าน
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                newpin: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api1/account/deletehousekeeper:
    delete:
      summary: ลบแม่บ้าน
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api1/account/refreshtoken:
    post:
      summary: รีเฟรชโทเคนผู้ดูแล
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api1/account/signout:
    post:
      summary: ออกจากระบบผู้ดูแล
      tags: [Account]
      responses:
        '200':
          description: สำเร็จ

  /api1/account/otp/send:
    post:
      summary: ส่งรหัส OTP
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200':
          description: ส่ง OTP สำเร็จ

  /api1/account/otp/verify:
    post:
      summary: ยืนยันรหัส OTP
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                otp: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api1/account/otp/reset:
    post:
      summary: รีเซ็ตรหัสผ่าน
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api1/account/member:
    get:
      summary: สตรีมรายชื่อสมาชิก
      tags: [Account]
      responses:
        '200':
          description: stream

  /api1/account/housekeepers:
    get:
      summary: สตรีมรายชื่อแม่บ้าน
      tags: [Account]
      responses:
        '200':
          description: stream

  /api1/account/logsmonitoring:
    get:
      summary: สตรีม logs การใช้งาน
      tags: [Account]
      responses:
        '200':
          description: stream

  ########################################################
  # User
  ########################################################
  /api2/user/sse/{floors}/{rooms}:
    get:
      summary: สตรีมข้อมูลผู้ใช้ตามห้อง
      tags: [User]
      parameters:
        - name: floors
          in: path
          required: true
          schema: { type: string }
        - name: rooms
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: stream

  /api2/user/key:
    post:
      summary: ตรวจสอบ PIN ผู้ใช้
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string }
                pin: { type: string }
                room_number: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api2/user/admin-key:
    post:
      summary: เปิดประตูด้วย PIN แอดมิน
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string }
                room_number: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api2/user/search-pin:
    post:
      summary: ค้นหาหมายเลข PIN
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api2/user/endmeeting:
    patch:
      summary: สิ้นสุดการประชุม
      tags: [User]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string }
                room_number: { type: string }
      responses:
        '200':
          description: สำเร็จ

  /api2/user/closedoor:
    post:
      summary: ปิดประตูห้องประชุม
      tags: [User]
      requestBody:
        content:
          application/json:
