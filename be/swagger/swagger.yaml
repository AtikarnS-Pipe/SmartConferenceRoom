openapi: 3.0.0
info:
  title: Smart Conference Display System API
  version: "1.0.0"
  description: |
    this document describes the API for Smart Conference Display System by
    running on Node.js/Express under the `be` project. This file is an
    OpenAPI Specification (also known as Swagger) and can be loaded into
    Swagger UI to generate an interactive API documentation page immediately.

servers:
  - url: http://localhost:4000
    description: Local server for development

tags:
  - name: Admin Panel
    description: API สำหรับผู้ดูแลระบบและตารางห้องประชุม
  - name: Account
    description: API สำหรับการจัดการบัญชีและแม่บ้าน
  - name: User
    description: API สำหรับผู้ใช้งานห้องประชุม
  - name: Superadmin
    description: API สำหรับจัดการผู้ดูแลระดับสูง
  - name: LED status indicator
    description: API สำหรับจัดการการแสดงผลไฟสถานะ LED ที่ขอบจอหน้าห้องประชุม

paths:
  ########################################################
  # LED status indicator
  ########################################################
  /api1/led-status:
    get:
      summary: "Get LED Status"
      description: |
        This endpoint retrieves the current LED status of the light ring around the meeting room display.
        Useful for monitoring room availability via visual indicators (e.g., green for available, red for occupied).
      tags: [LED status indicator]
      parameters:
        - name: access_token
          in: query
          required: true
          description: Token used to authenticate and access the LED status of the device.
          schema:
            type: string
            example: "your-access-token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "frame" }
                brightness: { type: string, example: "1" }
                color: { type: string, example: "#FF0000" }

      responses:
        '200':
          description: "Successfully retrieved LED status"
          content:
            application/json:
              schema: 
                type: object
                properties:
                  room:
                    type: string
                    example: "1501"
                  ip:
                    type: string
                    example: "19.1.56.110"
                  status:
                    type: string
                    enum: [available, occupied]
                    example: "occupied"
                  color:
                    type: string
                    example: "#FF0000"
        '404':
          description: "Room not found or LED status unavailable"
        '500':
          description: "Internal server error"

  ########################################################
  # Admin Panel
  ########################################################
  /api1/admin/sse:
    get:
      summary: "รับข้อมูลการประชุมในวันนั้นทั้งหมด 10 ห้องประชุมบนชั้น 15 จาก microsoft แบบ SSE"
      description: |
        Endpoint นี้สตรีมข้อมูลการประชุมในวันนั้นทั้งหมดจาก microsoft ออกมาแบบ Server‑Sent Events (SSE)
        ให้ใช้เฉพาะสำหรับรับข้อมูลที่อัพเดตตลอดเวลา; Swagger UI จะแสดงเพียง Response header
        แต่จะไม่สามารถเปิด stream แบบ realtime ได้ในหน้าเอกสาร!!!.
      tags: [Admin Panel]
      parameters:
        - in: query
          required: true
          name: code
          schema:
            type: string
          description: code ที่ได้จากการขอสิทธิ์กับ Microsoft Graph API เมื่อ Login success
