openapi: 3.0.0
info:
  title: Smart Conference Display System API
  version: "1.0.0"
  description: |
    this document describes the API for Smart Conference Display System by
    running on Node.js/Express under the `be` project. This file is an
    OpenAPI Specification (also known as Swagger) and can be loaded into
    Swagger UI to generate an interactive API documentation page immediately.

servers:
  - url: http://localhost:4000
    description: Local server for development

tags:
  - name: Admin Panel
    description: API สำหรับผู้ดูแลระบบและตารางห้องประชุม
  - name: Account
    description: API สำหรับการจัดการบัญชีและแม่บ้าน
  - name: User
    description: API สำหรับผู้ใช้งานห้องประชุม
  - name: Superadmin
    description: API สำหรับจัดการผู้ดูแลระดับสูง

paths:
  ########################################################
  # Admin Panel
  ########################################################
  /api1/admin/sse:
    get:
      summary: รับข้อมูลการประชุมในวันนั้นทั้งหมด 10 ห้องประชุมบนชั้น 15 จาก microsoft แบบ SSE
